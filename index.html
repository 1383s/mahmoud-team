<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تيم العمل - محمود 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0f172a; --bg-card: #1e293b; 
            --primary: #3b82f6; --secondary: #10b981;
            --text-main: #f1f5f9; --text-muted: #94a3b8;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; outline: none; }
        body { 
            background-color: var(--bg-body);
            background-image: radial-gradient(at 100% 0%, hsla(160, 40%, 15%, 1) 0, transparent 50%), radial-gradient(at 0% 100%, hsla(220, 39%, 20%, 1) 0, transparent 50%);
            color: var(--text-main); margin: 0; padding: 0; min-height: 100vh;
        }
        #loginContainer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: rgba(30, 41, 59, 0.95);
            padding: 40px; border-radius: 20px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 25px rgba(0,0,0,0.5);
        }
        #loginContainer h2 { color: var(--secondary); margin-bottom: 30px; }
        #loginContainer input { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; margin-bottom: 15px; padding: 15px; width: 100%; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.8); padding: 15px 25px; border-radius: 12px; margin-bottom: 30px; border-bottom: 2px solid var(--secondary); }
        .wallet-card { background: linear-gradient(135deg, #059669, #10b981); color: white; padding: 25px; border-radius: 16px; text-align: center; margin-bottom: 30px; }
        .wallet-card h3 { font-size: 2.5rem; margin: 10px 0; font-weight: 900; }
        .btn-primary { background: var(--secondary); color: white; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        .btn-primary:hover { background: #047857; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: var(--danger); border:none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        
        /* Table Styles */
        .table-wrapper { background: var(--bg-card); border-radius: 16px; overflow-x: auto; padding: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { color: var(--text-muted); padding: 10px; font-size: 0.9rem; }
        td { background: #263346; padding: 15px; text-align: center; vertical-align: middle; }
        td:first-child { border-radius: 0 10px 10px 0; }
        td:last-child { border-radius: 10px 0 0 10px; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-blocked { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        /* Action Buttons */
        .action-btn { border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; margin: 0 3px; transition: 0.2s; }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-edit { background: rgba(59, 130, 246, 0.15); color: var(--primary); } 
        .btn-eject { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .btn-block { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .btn-copy { background: #334155; color: white; width: auto; padding: 0 10px; font-size: 0.8rem; height: 30px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 95%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1); }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }
        
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; margin-top: 10px; }
        .toast-success { background: #059669; }
        .toast-error { background: #dc2626; }
        
        @media (max-width: 768px) { 
            td { display: block; text-align: right; padding: 10px; border-bottom: 1px solid #334155; } 
            thead { display: none; } 
            td::before { content: attr(data-label); float: left; color: var(--text-muted); font-size: 0.85rem; } 
            .action-btn { width: 40px; height: 40px; margin: 5px; }
            td:last-child { display: flex; justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js';
    import { getDatabase, ref, onValue, update, set, remove } from 'https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js'; 

    // إعدادات الفايربيز (لا تعدل فيها)
    const firebaseConfig = {
        apiKey: "AIzaSyBK6FZF3LW83qaUHBKYTfiVd2Ozrd1Rf2g",
        authDomain: "thanawy-1383.firebaseapp.com",
        databaseURL: "https://thanawy-1383-default-rtdb.firebaseio.com",
        projectId: "thanawy-1383",
        storageBucket: "thanawy-1383.firebasestorage.app",
        messagingSenderId: "1026664406457",
        appId: "1:1026664406457:web:87d71f7e41bef36ba0aa68",
        measurementId: "G-J5R2EFM2D0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const codesRef = ref(db, 'approvedStudents');

    const MY_ROLE_NAME = 'mahmoud'; 
    const MAHMOUD_UID = "4yVf0b4WSTh36foBBFNxmivQ5ww2"; // تأكد إن ده الـ UID الصحيح

    let myCodes = []; 

    window.showToast = (msg, type = "success") => {
        const container = document.getElementById('toast-container');
        const div = document.createElement('div');
        div.className = `toast toast-${type}`;
        div.innerHTML = msg;
        container.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            if(user.uid !== MAHMOUD_UID) {
                showToast("❌ غير مصرح لك بدخول لوحة محمود", "error");
                signOut(auth);
                return;
            }
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadMyData();
        } else {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
        }
    });

    window.handleLogin = (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.querySelector('button[type="submit"]');
        btn.innerText = "جاري الدخول...";
        signInWithEmailAndPassword(auth, email, pass).catch(err => {
            btn.innerText = "دخول المسوقين";
            showToast("خطأ في الدخول", "error");
        });
    };

    window.logout = () => signOut(auth);

    function loadMyData() {
        onValue(codesRef, (snap) => {
            const data = snap.val() || {};
            myCodes = Object.values(data).filter(item => 
                item.addedByAdmin && item.addedByAdmin.toLowerCase() === MY_ROLE_NAME
            );
            updateWalletStats();
            renderTable();
        });
    }

    function updateWalletStats() {
        const total = myCodes.reduce((sum, item) => sum + (parseFloat(item.pricePaid) || 0), 0);
        document.getElementById('myBalance').innerText = total.toLocaleString() + ' ج.م';
        document.getElementById('studentsCount').innerText = myCodes.length + ' طالب';
    }

    window.renderTable = () => {
        const search = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : "";
        const tbody = document.getElementById('codesBody');
        tbody.innerHTML = '';

        const filtered = myCodes
            .sort((a,b) => b.approvedAt - a.approvedAt)
            .filter(c => c.name.toLowerCase().includes(search) || c.uid.includes(search));

        if(filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="color:var(--text-muted)">لا توجد بيانات...</td></tr>`;
            return;
        }

        const now = Date.now();
        filtered.forEach(item => {
            const isExpired = item.expiry < now;
            let status = isExpired ? '<span class="badge badge-expired">منتهي</span>' : '<span class="badge badge-active">نشط</span>';
            if(item.isBlocked) status = '<span class="badge badge-blocked">محظور</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td data-label="الكود"><span style="font-family:monospace; color:var(--primary); font-weight:bold;">${item.uid}</span> <button onclick="copyToClip('${item.uid}')" class="action-btn btn-copy"><i class="fas fa-copy"></i></button></td>
                <td data-label="الاسم">${item.name}</td>
                <td data-label="المبلغ">${item.pricePaid}</td>
                <td data-label="الشعبة">${item.section}</td>
                <td data-label="الحالة">${status}</td>
                <td data-label="ID الجهاز" style="font-size:0.8rem; color:#aaa;">${item.deviceId ? '...'+item.deviceId.slice(-6) : '--'}</td>
                <td data-label="الإجراءات">
                    <button onclick="openEditStudent('${item.uid}')" class="action-btn btn-edit" title="تعديل"><i class="fas fa-edit"></i></button>
                    <button onclick="ejectDevice('${item.uid}', '${item.name}')" class="action-btn btn-eject" title="طرد الجهاز"><i class="fas fa-mobile-alt"></i></button>
                    <button onclick="toggleBlock('${item.uid}', ${item.isBlocked})" class="action-btn btn-block" title="حظر/فك حظر"><i class="fas ${item.isBlocked ? 'fa-play' : 'fa-pause'}"></i></button>
                    <button onclick="deleteStudent('${item.uid}', '${item.name}')" class="action-btn btn-delete" title="حذف نهائي"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    };

    window.copyToClip = (text) => { navigator.clipboard.writeText(text); showToast("تم النسخ ✅"); };
    
    // ==========================================
    // دوال التحكم الجديدة (حذف، حظر، طرد، تعديل)
    // ==========================================

    // 1. حذف الطالب
    window.deleteStudent = (uid, name) => {
        if(confirm(`⚠️ تحذير خطير: هل أنت متأكد من حذف الطالب "${name}" نهائياً؟`)) {
            remove(ref(db, 'approvedStudents/' + uid))
            .then(() => showToast("🗑️ تم الحذف بنجاح", "error"))
            .catch(err => showToast("خطأ: " + err.message, "error"));
        }
    };

    // 2. حظر/فك حظر
    window.toggleBlock = (uid, currentStatus) => {
        update(ref(db, 'approvedStudents/' + uid), { isBlocked: !currentStatus })
        .then(() => showToast(currentStatus ? "✅ تم تفعيل الطالب" : "⛔ تم حظر الطالب", "warning"));
    };

    // 3. طرد الجهاز
    window.ejectDevice = (uid, name) => {
        if(confirm(`هل تريد طرد جهاز الطالب ${name}؟ سيتمكن من الدخول من جهاز جديد.`)) {
            update(ref(db, 'approvedStudents/' + uid), { deviceId: "" })
            .then(() => showToast("📱 تم طرد الجهاز بنجاح"));
        }
    };

    // 4. تعديل البيانات
    window.openEditStudent = (uid) => {
        const student = myCodes.find(c => c.uid === uid);
        if(student) {
            document.getElementById('editUid').value = uid;
            document.getElementById('editName').value = student.name;
            document.getElementById('editSection').value = student.section;
            document.getElementById('editPrice').value = student.pricePaid;
            document.getElementById('editModal').style.display = 'flex';
        }
    };

    window.saveEdit = (e) => {
        e.preventDefault();
        const uid = document.getElementById('editUid').value;
        const updates = {
            name: document.getElementById('editName').value,
            section: document.getElementById('editSection').value,
            pricePaid: parseFloat(document.getElementById('editPrice').value) || 0
        };
        update(ref(db, 'approvedStudents/' + uid), updates)
        .then(() => {
            showToast("✅ تم تعديل البيانات");
            document.getElementById('editModal').style.display = 'none';
        });
    };

    // إضافة جديد
    window.generateCode = () => {
        let code;
        do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (false); 
        document.getElementById('newCodeText').innerText = code;
    };
    window.openAddModal = () => { generateCode(); document.getElementById('addModal').style.display = 'flex'; };
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    window.saveCode = (e) => {
        e.preventDefault();
        const code = document.getElementById('newCodeText').innerText;
        const name = document.getElementById('sName').value;
        const section = document.getElementById('sSection').value;
        const price = parseFloat(document.getElementById('sPrice').value) || 0;
        const duration = document.getElementById('sDuration').value;

        let expiryTime = Date.now();
        if (duration === 'trial') expiryTime += 3600000; 
        else if (duration === 'month') expiryTime += 2592000000; 
        
        const newStudent = {
            uid: code, name: name, section: section, pricePaid: price,
            addedByAdmin: MY_ROLE_NAME, approvedAt: Date.now(),
            expiry: expiryTime, deviceId: "", isBlocked: false
        };

        set(ref(db, 'approvedStudents/' + code), newStudent)
        .then(() => { showToast("تم الحفظ 🎉"); closeModal('addModal'); document.getElementById('addForm').reset(); })
        .catch(err => showToast("خطأ: " + err.message, "error"));
    };
</script>

<div class="container">
    <div id="loginContainer">
        <h2><i class="fas fa-users-cog"></i> فريق العمل</h2>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn-primary">دخول المسوقين</button>
        </form>
    </div>

    <div id="mainContent" style="display:none;">
        <header>
            <div style="font-weight:bold; font-size:1.2rem; color:white;">👋 أهلاً يا بطل</div>
            <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </header>

        <div class="wallet-card">
            <i class="fas fa-wallet fa-2x" style="opacity:0.8; margin-bottom:10px;"></i>
            <p>رصيدك الحالي</p>
            <h3 id="myBalance">0 ج.م</h3>
            <div style="font-size:0.9rem; margin-top:10px; opacity:0.8;">عدد طلابك: <span id="studentsCount">0</span></div>
        </div>

        <button class="btn-primary" onclick="openAddModal()" style="margin-bottom:20px;">
            <i class="fas fa-user-plus"></i> إضافة كود جديد
        </button>

        <div style="margin-bottom:20px;">
            <input type="text" id="searchInput" placeholder="🔍 ابحث في أكوادك..." oninput="renderTable()" 
            style="width:100%; padding:12px; border-radius:10px; background:#1e293b; border:1px solid #334155; color:white;">
        </div>

        <div class="table-wrapper">
            <table>
                <thead><tr><th>الكود</th><th>الاسم</th><th>المبلغ</th><th>الشعبة</th><th>الحالة</th><th>الجهاز</th><th>الإجراءات</th></tr></thead>
                <tbody id="codesBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="addModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color:var(--secondary); text-align:center;">إضافة طالب</h3>
        <div style="text-align:center; margin:15px 0; background:#0f172a; padding:10px; border-radius:10px; font-size:1.5rem; color:white; font-weight:bold;" id="newCodeText">---</div>
        <form id="addForm" onsubmit="saveCode(event)">
            <input type="text" id="sName" placeholder="اسم الطالب" required>
            <select id="sSection" required><option value="">اختر الشعبة</option><option value="علمي علوم">علمي علوم</option><option value="علمي رياضة">علمي رياضة</option><option value="أدبي">أدبي</option><option value="أزهر">أزهر</option></select>
            <input type="number" id="sPrice" placeholder="المبلغ المحصل" required>
            <select id="sDuration"><option value="month">شهر (30 يوم)</option><option value="trial">تجريبي (ساعة)</option></select>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn-primary">حفظ الكود</button>
                <button type="button" onclick="closeModal('addModal')" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:50px; cursor:pointer;">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color:var(--primary); text-align:center;">✏️ تعديل بيانات</h3>
        <form onsubmit="saveEdit(event)">
            <input type="hidden" id="editUid">
            <label style="color:#aaa; font-size:0.9rem;">الاسم:</label>
            <input type="text" id="editName" required>
            <label style="color:#aaa; font-size:0.9rem;">الشعبة:</label>
            <select id="editSection"><option value="علمي علوم">علمي علوم</option><option value="علمي رياضة">علمي رياضة</option><option value="أدبي">أدبي</option><option value="أزهر">أزهر</option></select>
            <label style="color:#aaa; font-size:0.9rem;">المبلغ:</label>
            <input type="number" id="editPrice" required>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn-primary">حفظ التعديلات</button>
                <button type="button" onclick="closeModal('editModal')" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:50px; cursor:pointer;">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<div id="toast-container"></div>
</body>
</html>
